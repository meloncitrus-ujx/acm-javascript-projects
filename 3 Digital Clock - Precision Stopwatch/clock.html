<!DOCTYPE html>
<html>
<head> 

<title> Digital Clock & Precision Stopwatch </title>
<style>  
body{
  background-image: linear-gradient(rgba(0,0,0, 0.6), rgba(0,0,0,0.6)), url(/images/digitalclockbg.jpg);
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
  /*scrollbar*/
  margin: 0;
}
#container{
  display: flex;
  justify-content: center ;
  align-items: center;
  height: 100vh
}
#clock {
  font-family: monospace;
  font-size: 70px;
  color: white;
  font-weight: bold;
  text-align: center;
  backdrop-filter: blur(10px);
  background-color: rgba(128, 128, 128, 0.081); /*lower opacity in rgba foggy glass look*/
  padding : 30px;
  border-radius: 45px;
}


</style>
</head>
  
<body> 
    <div id="container"> 
      <div id="clock"> 
        00:00:00
      </div>
    </div>
  

<script src = "script.js"> </script>






</body>
</html>
