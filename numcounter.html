<!DOCTYPE html>
<html>
    <head> 
      
<title> Number Counter </title>
<style> 
#para{
  font-size: larger;
  font-family: Verdana;
  text-align: center;
  text-decoration: underline;
  text-decoration-style: wavy;
  text-decoration-color: blue;
  text-underline-offset: 7px;

}
#countlabel { 
  display: block;
  text-align: center;
  font-size: 50px;
  font-family: Verdana;
}
#btncontainer{
  text-align: center;
}
.cs-btn{ 
  padding: 5px 15px;
  font-size: 25px;
  color: white; 
  background-color: rgb(173, 216, 230);
  border-radius: 5px;
  transition: background-color 0.25s;
}
.cs-btn:hover{
  background-color: rgb(173, 196, 230) ;
}


  
</style>
  </head>
  <body> 
    <p id="para"><b>Number Counter</b></p>  <br>
    <label id="countlabel"> 0 </label> <br>
    <div id ="btncontainer">
      <button id="decrementbtn" class="cs-btn"> decrement </button>
      <button id="resetbtn" class="cs-btn"> reset </button>
      <button id="incrementbtn" class="cs-btn"> increment </button>
    </div>
  

<script src ='/js-workshop/1 Interactive Counter & Temperature Converter/script.js'> </script>



</body>

</html>
