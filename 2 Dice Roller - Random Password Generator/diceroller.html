<!DOCTYPE html>
<html>
<head> 

<title> Dice Roller & Random Password generator </title>
<style>  
#container{
  font-family: Arial;
  text-align: center;
  font-size: 30px;
}
button{
  font-size: 15px;
  padding: 10px 15px;
  border-radius: 5px;
  background-color: lightblue;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
button:hover{
  background-color: rgb(173, 196, 230);
}
button:active{
  background-color: rgb(173, 150, 230);;
}
input{
  font-size: 25px;
  border-radius: 5px;
  width: 150px;
  text-align: center;
}

</style>
</head>
  
<body> 
    <div id="container"> 
      <h1> Dice Roller </h1>
      <label><b> # of dice: </b> </label>

      <input type="number" id="numofdice" value="1" min="1">
      <!-- min only stops up/down arrow to not go below 1 but cant stop user from manually inputting -->
      <button class="js-btn"> Roll Dice </button> 

      <div id="result"> </div>
      <div id="images"> </div>
    </div>
  

<script type = "module" src = "dicerollerscript.js"> </script>






</body>
</html>
