<!DOCTYPE html>
<html>
    <head> 
      
<title> Number Counter & Temperature Conversion </title>
<style>  
#heading1{
  font-family: Verdana;
  text-align: center;
  text-decoration: underline;
  text-decoration-color: blue;
  text-underline-offset: 7px;

}
#countlabel { 
  display: block;
  text-align: center;
  font-size: 50px;
  font-family: Verdana;
}
#btncontainer{
  text-align: center;
  margin-bottom: 50px;
}
.css-btn{ 
  padding: 5px 15px;
  font-size: 25px;
  color: white; 
  background-color: rgb(173, 216, 230);
  border-radius: 5px;
  transition: background-color 0.25s;
}
.css-btn:hover{
  background-color: rgb(173, 196, 230) ;
}
#heading2 {
  text-align:center;
  padding-bottom: 25px;
  text-decoration: underline;
  text-decoration-color: blue;
  text-underline-offset: 7px;
  font-family: Verdana;
}
form{
  margin-top: 50px;
  background-color:  lightgrey;
  text-align: center;
  max-width: 500px;
  margin: auto;
  padding: 25px;
  border-radius: 10px;
  box-shadow: 5px 5px 15px black ;
}
#textbox{
  width: 50%;
  text-align: center;
  font-size: 20px;
  border-radius: 5px;
  margin-bottom: 15px;
}
label{
  font-size: 20px;
  font-weight: bold;
}
.submitbtn{
  margin-top: 15px;
  background-color: lightblue;
  font-size: 20px;
  color: white;
  padding: 15px 20px;
  border-radius: 5px;
  cursor: pointer; 
  box-shadow: 5px 5px 15px rgb(0 0 0/0.20) ;
  
}
.submitbtn:hover{
  background-color: rgb(173, 196, 230) ;
}
#result {
  font-size: 25px;

}


  
</style>
  </head>
  <body> 
    <h1 id="heading1">Number Counter</h1>  <br>
    <label id="countlabel"> 0 </label> <br>
    <div id ="btncontainer">
      <button id="decrementbtn" class="css-btn"> decrement </button>
      <button id="resetbtn" class="css-btn"> reset </button>
      <button id="incrementbtn" class="css-btn"> increment </button>
    </div>

    <form> 
          <h1 id="heading2"> Temperature Conversion: </h1>
          
          <input type="number" id="textbox" value="0"> <br>

          <input type="radio" id="tofaren" name="unit"> 
          <label for="tofaren"> Celsius ➡️ Farenheit </label> <br>

          <input type="radio" id="tocels" name="unit">
          <label for="tocels"> Farenheit ➡️ Celsius </label> <br>

          <button type="button" class="submitbtn" onclick="convert()""> submit </button>
          <p id="result"> Select a unit </p>
      </form>
  

<script src ='script.js'> </script>



</body>

</html>
