<!DOCTYPE html>
<html>
  <head> 
<title> rock paper scissors </title>
<style> 
   body{ 
background-color: rgb(18,37,96);
color: white; 
font-family: Arial; 
text-align: center;
}
.title{ 
font-size: 30px; 
font-weight: bold; 
margin-top: 50px;
margin-bottom: 30px;
}
.move-icon{
  height: 50px;
}
.move-button{ 
  background-color: transparent;
  border: 3px solid white; 
  width: 120px;
  height: 120px; 
  border-radius: 60px;
  margin: 10px;
  cursor: pointer;
}
.result{ 
  font-size: 25px;
  font-weight: bold;
  margin-top: 40px;
} 
.score{
  margin: 30px auto;
  padding: 15px 25px;
  font-size: 20px;
  border: 2px solid white;
  width: fit-content;
  background-color: rgba(255, 255, 255, 0.08);
}
.reset-score-button,
.auto-play-button{
  background-color: white;
  border: none;
  border-radius: 15px;
  font-size: 15px ;
  padding: 8px 15px; 
  cursor: pointer;
  margin-top: 20px;
   }
  
</style>
  </head>
  <body> 
<p class="title"> Rock Paper Scissors </p>

  <button  class="move-button js-rock-button"> 
  <img src="images/rock-emoji.png" class="move-icon"> </button>

  <!--onclick="  playGame('paper');"-->
  <button class="move-button js-paper-button">  
  <img src="images/paper-emoji.png" class="move-icon"></button>

  <button class="move-button js-scissors-button"> 
   <img src="images/scissors-emoji.png" class="move-icon"> </button>

  <p class = 'js-result result'> </p>
  <p class = 'js-moves'>   </p>
  <p class = 'js-score score'>  </p>

  <button onclick="
score.wins = 0;
score.losses = 0;
score.ties = 0;
localStorage.removeItem('score');
updateScoreElement();
document.querySelector('.js-result').innerHTML = '';
document.querySelector('.js-moves').innerHTML = '';
  " class="reset-score-button"> reset </button>

<button class ="auto-play-button js-auto-play-button" > Auto Play
</button>

<script src ='js-workshop/6 Interactive Rock-Paper-Scissors/script.js'> </script> 
<!-- <script src ='rockpaperscissor.js'> </script> -->

</body>

</html>
